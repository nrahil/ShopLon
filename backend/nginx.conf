# Load balancer in front of the API replicas.
# Docker's DNS resolves "api" to every replica, and nginx re-resolves it
# every 10 s, so `docker compose up --scale api=N` takes effect without a restart.
worker_processes auto;

# Each proxied request holds two connections (client + upstream). The default
# of 512 caps concurrency at ~250 in-flight requests.
events {
  worker_connections 8192;
}

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream api_upstream {
    zone api_upstream 64k;
    least_conn;
    server api:3000 resolve;
    keepalive 64;
  }

  # Coarse per-IP flood protection at the edge. Fine-grained, per-user limits
  # live in the API and are shared across replicas through Redis.
  # (Generous so the local load test, which comes from one IP, isn't throttled.)
  limit_req_zone $binary_remote_addr zone=edge:10m rate=200r/s;
  limit_req_status 429;

  server {
    listen 8080;
    client_max_body_size 64k;
    server_tokens off;

    # Internal endpoints are not exposed publicly.
    location = /metrics { return 404; }

    location / {
      limit_req zone=edge burst=1000 nodelay;
      proxy_pass http://api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-Id $request_id;
      # Retry another replica if one is down. Only idempotent methods are retried.
      proxy_next_upstream error timeout http_502 http_503;
      proxy_connect_timeout 2s;
      proxy_read_timeout 30s;
      add_header X-Upstream $upstream_addr always;
    }
  }
}
